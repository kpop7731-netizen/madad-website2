<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مِداد | معرض الصفحات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0D0B08; font-family: 'Cairo', sans-serif; color: #EDE6D6; line-height: 1.8; }
    
    header { text-align: center; padding: 40px 20px 20px; border-bottom: 1px solid #2A2419; }
    .brand { font-family: 'Aref Ruqaa', serif; font-size: 48px; color: #C9A24B; }
    .sub-brand { font-size: 14px; color: #A69B7E; letter-spacing: 2px; }

    .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
    .section-title { text-align: center; font-family: 'Aref Ruqaa', serif; font-size: 28px; color: #C9A24B; margin-bottom: 25px; }

    /* تصميم سلايدر الصور */
    .slider-container { position: relative; max-width: 750px; margin: 0 auto; background: #16130F; border: 1px solid #2A2419; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .slider-wrapper { display: flex; transition: transform 0.5s ease-in-out; }
    .slide { min-width: 100%; box-sizing: border-box; text-align: center; background: #000; }
    .slide img { width: 100%; max-height: 520px; object-fit: contain; display: block; }
    
    /* أزرار التنقل */
    .prev-btn, .next-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(13, 11, 8, 0.7); color: #C9A24B; border: 1px solid #C9A24B; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; z-index: 10; }
    .prev-btn:hover, .next-btn:hover { background: #C9A24B; color: #0D0B08; }
    .prev-btn { right: 15px; }
    .next-btn { left: 15px; }

    /* معلومات الصورة والحالة */
    .slider-info { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #16130F; border-top: 1px solid #2A2419; }
    .slide-counter { font-size: 14px; color: #C9A24B; font-weight: 600; }
    .slide-title { font-size: 14px; color: #EDE6D6; }

    /* نقاط المؤشر السفلية */
    .dots-container { display: flex; justify-content: center; gap: 6px; padding: 15px 10px; flex-wrap: wrap; background: #0D0B08; }
    .dot { width: 8px; height: 8px; background: #2A2419; border-radius: 50%; cursor: pointer; transition: all 0.3s; }
    .dot.active { background: #C9A24B; transform: scale(1.3); }

    footer { text-align: center; padding: 30px; font-size: 13px; color: #A69B7E; }
  </style>
</head>
<body>

  <header>
    <div class="brand">مِداد</div>
    <div class="sub-brand">(الشاب المسلم)</div>
  </header>

  <div class="container">
    <div class="section-title">استكشف صفحات مِداد (24 صورة)</div>
    
    <div class="slider-container" id="sliderContainer">
      <button class="prev-btn" onclick="moveSlide(-1)">&#10095;</button>
      <button class="next-btn" onclick="moveSlide(1)">&#10094;</button>

      <div class="slider-wrapper" id="sliderWrapper"></div>

      <div class="slider-info">
        <span class="slide-title" id="slideTitle">صفحة من مِداد</span>
        <span class="slide-counter" id="slideCounter">1 / 23</span>
      </div>
    </div>

    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <footer>
    جميع الحقوق محفوظة © مِداد
  </footer>

  <script>
    const imageFiles = [
      "IMG_3495.JPG", "IMG_3496.JPG", "IMG_3498.JPG", "IMG_3508.JPG",
      "IMG_3529.JPG", "IMG_3530.JPG", "IMG_3531.JPG", "IMG_3533.JPG",
      "IMG_3534.JPG", "IMG_3536.JPG", "IMG_3537.JPG", "IMG_3538.JPG",
      "IMG_3540.JPG", "IMG_3541.JPG", "IMG_3542.JPG", "IMG_3543.JPG",
      "IMG_3545.JPG", "IMG_3546.JPG", "IMG_3548.JPG", "IMG_3549.png",
      "IMG_3550.JPG", "IMG_3552.JPG", "IMG_3553.JPG"
    ];

    let currentIndex = 0;
    let autoSlideTimer;

    function initSlider() {
      const wrapper = document.getElementById('sliderWrapper');
      const dotsContainer = document.getElementById('dotsContainer');
      
      wrapper.innerHTML = '';
      dotsContainer.innerHTML = '';

      imageFiles.forEach((file, index) => {
        // إنشاء السلايد
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.innerHTML = `<img src="images/${encodeURIComponent(file)}" alt="صفحة ${index + 1}">`;
        wrapper.appendChild(slide);

        // إنشاء النقطة السفلية
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => goToSlide(index);
        dotsContainer.appendChild(dot);
      });

      updateSlider();
      startAutoSlide();
    }

    function updateSlider() {
      const wrapper = document.getElementById('sliderWrapper');
      wrapper.style.transform = `translateX(${currentIndex * 100}%)`;

      document.getElementById('slideCounter').textContent = `${currentIndex + 1} / ${imageFiles.length}`;
      document.getElementById('slideTitle').textContent = `صفحة من دفتر مِداد (${currentIndex + 1})`;

      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });
    }

    function moveSlide(direction) {
      currentIndex = (currentIndex + direction + imageFiles.length) % imageFiles.length;
      updateSlider();
      resetAutoSlide();
    }

    function goToSlide(index) {
      currentIndex = index;
      updateSlider();
      resetAutoSlide();
    }

    function startAutoSlide() {
      autoSlideTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % imageFiles.length;
        updateSlider();
      }, 3500); // يتنقل كل 3.5 ثانية
    }

    function resetAutoSlide() {
      clearInterval(autoSlideTimer);
      startAutoSlide();
    }

    // إيقاف التناقل عند وضع الماوس فوق السلايدر
    const sliderBox = document.getElementById('sliderContainer');
    sliderBox.addEventListener('mouseenter', () => clearInterval(autoSlideTimer));
    sliderBox.addEventListener('mouseleave', startAutoSlide);

    document.addEventListener('DOMContentLoaded', initSlider);
  </script>
</body>
</html>
